[package]
name = "bridgekit"
version = "0.1.0"
edition.workspace = true
description = "Reusable Rust bridge for Tauri apps that need store IAP and push notification integrations."
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"

[features]
default = []
apple-storekit-ffi = []
apple-apns-ffi = []
microsoft-store-ffi = []
microsoft-wns-ffi = []

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Services_Store",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_UI_Shell",
] }
windows-collections = "0.1"
windows-core = "0.58"

[dev-dependencies]
futures = "0.3.32"
